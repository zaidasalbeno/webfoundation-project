<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-info-subtle min-vh-100 d-flex flex-column">

    <nav class="navbar bg-black">
        <div class="container-fluid">
            <span class="navbar-text text-light fs-4 fst-italic">
                welcome to ZZ work connect plz take your time to login
            </span>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">

        <div class="container">
            <div class="row align-items-center justify-content-center g-5">

                <div class="col-md-5 text-center">
                    <img src="../public/projpic1.jfif" class="img-fluid rounded" alt="login image">
                </div>

                <div class="col-md-5">
                    <form class="bg-white p-4 rounded shadow">

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email address
                            </label>

                            <input type="email" class="form-control" id="email">

                            <div class="form-text">
                                we'll never share your email with anyone else.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input type="password" class="form-control" id="password">
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">

                            <label class="form-check-label" for="remember">
                                remember me
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            login
                        </button>
<a href="../html/createaccount.html" class="mt-5">dont have an account??</a>
                    </form>
                </div>

            </div>
        </div>

    </main>

    <footer class="bg-black text-light text-center p-3">
        <p class="mb-0"> 2026 ZZ work connect all rights reserved</p>
    </footer>

</body>
</html>
