<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="create-page">

<header>

    <nav class="navbar bg-black">

        <div class="container-fluid">

            <span class="navbar-text text-light fs-4 fst-italic">

                Welcome to ZZ Work Connect

            </span>

        </div>

    </nav>

</header>


<main class="flex-grow-1">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <form class="create d-flex flex-column">

                    <h1 class="create-title">
                        Create Account
                    </h1>


                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                        required>


                    <label for="lastname">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastname"
                        name="lastname"
                        class="form-control"
                        required>


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        required>


                    <label for="pass">
                        Create Password
                    </label>

                    <input
                        type="password"
                        id="pass"
                        name="pass"
                        class="form-control"
                        required>


                    <label for="pass2">
                        Verify Password
                    </label>

                    <input
                        type="password"
                        id="pass2"
                        name="pass2"
                        class="form-control"
                        required>


                    <a
                        href="../html/home.html"
                        class="cresss">

                        Create Account

                    </a>


                    <a
                        href="../html/login.html"
                        class="back-link">

                        Go Back...

                    </a>

                </form>

            </div>

        </div>

    </div>

</main>


<footer>

    <p>
         2026 ZZ Work Connect
    </p>

    <p>
        Find your next job with us
    </p>

</footer>


</body>

</html>
